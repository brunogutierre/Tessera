<input
  tes-input
  ngCombobox
  #combobox="ngCombobox"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  autocomplete="off"
  [value]="query()"
  (valueChange)="onQueryChange($event)"
  [(expanded)]="expanded"
  [disabled]="disabled()"
  [softDisabled]="false"
  [required]="required()"
  [invalid]="invalid()"
  [placeholder]="placeholder()"
  [attr.aria-label]="field ? null : (label() ?? null)"
  (blur)="touch.emit()"
/>

<!-- The popup registers with the combobox at once; the overlay is its deferred content. -->
<ng-template ngComboboxPopup [combobox]="combobox">
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="true"
    [cdkConnectedOverlayPositions]="positions"
    [cdkConnectedOverlayMatchWidth]="true"
    cdkConnectedOverlayUsePopover="inline"
  >
    <div class="panel" data-tes-part="panel" (mousedown)="$event.preventDefault()">
      <div
        ngComboboxWidget
        ngListbox
        #listbox="ngListbox"
        class="list"
        data-tes-part="list"
        tabindex="-1"
        selectionMode="explicit"
        focusMode="activedescendant"
        [softDisabled]="false"
        [value]="selected()"
        (valueChange)="onSelectionChange($event)"
        [activeDescendant]="listbox.activeDescendant()"
      >
        @for (option of suggestions(); track option.value) {
          <div
            ngOption
            class="option"
            data-tes-part="option"
            [value]="option.value"
            [label]="option.label"
            [disabled]="!!option.disabled"
          >
            {{ option.label }}
          </div>
        }
      </div>
      @if (suggestions().length === 0) {
        <p class="empty" data-tes-part="empty" role="status">{{ labels.noResults }}</p>
      }
    </div>
  </ng-template>
</ng-template>

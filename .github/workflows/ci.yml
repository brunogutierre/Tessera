name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Styling parts match the docs
        run: npm run check:parts

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build and check the package
        run: npm run check:package

  stories:
    name: Story and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium-headless-shell

      # Every story must render, pass its play function and have no axe violations.
      - name: Story tests
        run: npm run test:stories

      - name: Build Storybook
        run: npm run build-storybook

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    # The same image renders the committed baselines locally (npm run test:visual:container).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Compare screenshots
        run: npm run test:visual
        env:
          CI: true

      - name: Upload the diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            playwright-report
            test-results
          retention-days: 7
